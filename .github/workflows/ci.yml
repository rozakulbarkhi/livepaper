name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 16 / Swift 6
        run: sudo xcode-select -switch /Applications/Xcode_16.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Check Swift Version
        run: swift --version

      - name: Run Tests
        run: swift test -v

      - name: Package App
        run: ./scripts/build_app.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LivePaper-macOS
          path: LivePaper-macOS.zip

  create-release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: LivePaper-macOS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: LivePaper-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
